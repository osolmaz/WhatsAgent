name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  SLOPHAMMER_GO_VERSION: v0.5.0

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: ./scripts/check-coverage.sh
      - run: go build ./cmd/whatsagent

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
      - run: golangci-lint run
      - run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
      - run: govulncheck ./...
      - run: go install github.com/osolmaz/slophammer/go/cmd/slophammer-go@${SLOPHAMMER_GO_VERSION}
      - run: slophammer-go dry .
      - run: slophammer-go crap .
      - run: slophammer-go check .
      - run: slophammer-go check . --execute

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build for Linux and macOS
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/whatsagent
          done
